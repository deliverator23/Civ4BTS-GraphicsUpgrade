; GraphicsUpgrade settings. Keep this file next to d3d9.dll in the Beyond the Sword folder, and restart the game after
; editing. A mod can override any setting with its own Mods\<mod>\GraphicsUpgrade\GraphicsUpgrade.ini.
; Colours are R,G,B from 0 to 255. Hotkeys are KeyModifiers plus a key: a digit or letter, a key name (F11, Numpad5,
; Home...), a symbol (/), or none.

[general]
KeyModifiers=ctrl+shift
; Saves a before/after pair of screenshots (with and without GraphicsUpgrade) in OutputDir's screenshots folder.
CompareKey=/
; Where the log and screenshots go. Empty = %LOCALAPPDATA%\GraphicsUpgrade.
OutputDir=
; Games to change: bts = Beyond the Sword and its mods. Anything else is passed straight through.
Games=bts
; Another d3d9.dll to pass calls on to (ReShade, DXVK). Empty = Windows' own.
ChainDll=

[lighting]
; GraphicsUpgrade's lighting instead of BtS's light files. The colours are Colonization's: a warm sun, a cool shade.
Enabled=1
ToggleKey=3
SunColour=255,235,188
AmbientColour=89,103,133
; Light units and ships from the shadows' sun (1) or BtS's own directions (0). LightDirection=x,y,z overrides both.
MatchShadowDirection=1
LightDirection=
; Unlit effects (dust, smoke, glows) drawn with these textures follow the light as the ground does: .dds files or
; folders under Assets, separated by ';', or * for all. Empty = none.
LitEffectTextures=
; Models drawn with these textures add the light to their colours as the ground does, rather than multiplying by it, so
; a strongly coloured light takes them as far as the ground beside them. For rock that should sit in the terrain, not
; for buildings: dark textures lose colour quickly. Entries as in LitEffectTextures, without *. Empty = none.
GroundLitTextures=
; How much brighter than their textures the light can make buildings, improvements and resources: 1 (BtS) to 2 (as
; the ground). Above 1, they keep following the light when sun and ambient together are brighter than white.
BuildingLightRange=1
; The light the game baked the terrain with. Empty = read from the game's SunLight.nif.
BakedTerrainSun=
BakedTerrainAmbient=
BakedTerrainDirection=

; Day-night cycle: a day every LightChangeCycleTime seconds in LightChangeStepCount steps (hours), starting at
; LightCycleStartStep (12 = midday). LightCycleToggleKey pauses it.
LightCycleOn=1
LightCycleToggleKey=4
LightChangeCycleTime=1440
LightChangeStepCount=24
LightCycleStartStep=12
; Sun and shade colours at chosen steps (step,R,G,B;...), blended in between. Or LightCycleImage: a PNG or BMP with a
; column per step, the sun on the top row and the shade on the second, which replaces both lists (looked for in the
; mod's GraphicsUpgrade folder, under Assets, then the GraphicsUpgrade folder here).
;                       midday (12)       afternoon (14)    afternoon (16)    golden hour (18)  sunset (20)       dusk (21)         night (22)        midnight (0)      night (2)         dawn (4)          dawn (5)          sunrise (6)       sunrise (7)       morning (8)       morning (10)
LightCycleSteps=        12,255,250,235;   14,255,238,203;   16,255,225,170;   18,255,220,32;    20,255,120,50;    21,210,70,55;     22,120,135,170;   0,120,135,170;    2,120,135,170;    4,150,90,180;     5,200,95,160;     6,235,105,110;    7,250,150,85;     8,255,225,170;    10,255,233,192
LightCycleAmbientSteps= 12,95,110,140;    14,92,107,137;    16,89,103,133;    18,96,90,114;     20,92,76,102;     21,78,69,98;      22,63,72,104;     0,63,72,104;      2,63,72,104;      4,63,72,104;      5,78,68,105;      6,104,88,116;     7,100,94,120;     8,89,103,133;     10,91,105,135
LightCycleImage=
; The sun's path round the sky: from SunMiddayFrom (N, NNE ... NNW, or degrees) at midday, SunMiddayHeight degrees up,
; lowest at sunrise and sunset (SunriseHeight), the moon MoonHeight up at midnight. With the cycle off, the sun stays
; where it is at LightCycleStartStep. Empty SunMiddayFrom = the fixed [shadows] SunDirection.
SunMiddayFrom=SSE
SunMiddayHeight=45
SunriseHeight=30
MoonHeight=50
; Shadows fade as the sun dims. MoonGlint: the moon's glint on the water at night (empty = the cycle's colour).
ShadowsFollowSun=1
MoonGlint=255,255,255

[lighting groups]
; Colours for one group only, kept through the day-night cycle. Empty = [lighting] SunColour / AmbientColour.
; Unit: people and animals. Mech: ships and vehicles. Tree: unlit in BtS. Building: buildings, improvements and other
; solid models. Water: the sun on the reflective water.
UnitSun=
UnitAmbient=
MechSun=
MechAmbient=
TerrainSun=
TerrainAmbient=
RiverSun=
RiverAmbient=
TreeSun=
TreeAmbient=
BuildingSun=
BuildingAmbient=
WaterSun=

[shadows]
; Sun shadows from units, ships, trees, buildings and hills. BtS's round blobs under units are hidden while it's on.
Enabled=1
ToggleKey=2
; How much light full shadow takes away (0 to 1), and edge softness (0 = hard).
Darkness=0.45
Softness=0.5
; The sun's direction (x,y,z, the way the light travels) when [lighting] SunMiddayFrom is empty: Colonization's.
SunDirection=-0.567005,0.433955,-0.700134
; Buildings and other solid models cast shadows instead of BtS's painted ones, this dark.
BuildingShadows=1
BuildingDarkness=0.68
; Hills and peaks shade the ground behind them. Length: a multiple of the terrain's true heights. Softness: world
; units the ground must rise above a sunbeam for full shadow.
HillShadows=1
HillShadowLength=1.64
HillShadowSoftness=8
; How much shadow the water's surface takes (0 = none, 1 = as on land).
WaterShadow=0.6
; Shadow texture size, and the most ground it covers each way from the view's centre (a tile = 180).
Size=2048
MaxRadius=2000
; BlobShadowTexture: BtS's blob under units (it marks where they stand). NoShadowTextures: models drawn with these cast
; no shadow (.dds files or folders under Assets, separated by ';', or on more lines of the same setting); the unit
; flags by default.
HideBlobShadows=1
BlobShadowTexture=Art\Units\01_UnitShadows\unit_shadows.dds
NoShadowTextures=Art\Units\Flags; Art\Units\Flag\Medallions.dds

[water]
; Colonization's reflective, dynamic water. Its textures are in the GraphicsUpgrade folder here, else read from
; ColonizationDir; with neither, BtS's water stays.
Enabled=1
ToggleKey=1
ColonizationDir=C:\Program Files (x86)\Steam\steamapps\common\Civilization IV Colonization
; More looks for the waves: water_normal_1.dds, water_normal_2.dds... beside water_normal.dds, each a normal map
; covering 1440 world units (8 plots). NormalMapToggleKey cycles through them, water_normal.dds first; NormalMap is
; the one at the start (0 = water_normal.dds).
NormalMapToggleKey=7
NormalMap=0
; Colonization's water look:
; ReflectionEvenness: real water mirrors little of the sky looking straight down (10%) and much more towards the
;   horizon (70%); this pulls both towards half (0 = true to life, 1 = half mirror, half see-through everywhere).
; ReflectionRipple: how far the waves bend the reflected sky and ships (0 = a flat mirror).
; RefractionRipple: how far the waves bend the shallows and sea floor seen through the water (0 = flat glass).
ReflectionEvenness=0.22995
ReflectionRipple=0.238738
RefractionRipple=0.0954951
; Models drawn with these textures are water, like an oasis' pool (.dds files or folders under Assets, separated by ';',
; or on more lines of the same setting).
SurfaceTextures=Art\Terrain\Features\Oasis\oasis_water.dds
; Hulls show through the water: clearest just under it (Visibility 0 to 1), gone Depth world units down (0 = hidden),
; fading in Bands steps.
UnderwaterDepth=25
UnderwaterVisibility=0.7
UnderwaterBands=8
; GlintFollowsSun: 1 = the sun's glint follows the sun, kept in view (arcing steadily over it from right to left over
; the day, then swinging quickly round behind the view around sunset, when the moon's takes over and does the same
; through the night); 2 = exactly where the sun is; 0 = Colonization's fixed glint. Caustics: sunlight shimmering on the
; shallow sea floor (0 = off, 1 = normal, up to 4).
GlintFollowsSun=1
Caustics=1
; WaveShading: the waves' faces lit by the sun or moon (lighter turned towards it, darker turned away), so the water
; moves even away from the glint, and sparkle on choppy water around the glint (0 = off, up to 255).
WaveShading=64
; FoamLight: how much of the light's colour and brightness the coast waves' foam takes (0 = always white, as BtS draws
; it; 1 = all of it, like the ground).
FoamLight=0.4
; RiverGlint: the sea's glint off the rivers too, where they mirror the sun or moon (moving with the sea's; 0 = off,
; 128 = normal, up to 255).
RiverGlint=128
; RiverShimmer: the rivers' ripples sway back and forth along the channel, this many texels of their normal map each
; way (0 = still, up to 3). Shows best with a rippled river normal map (Art/Terrain/Routes/Rivers/AllRiversNormal.dds).
RiverShimmer=3

[reflection]
; Ships reflected in the water. Size: the reflection texture in pixels (Colonization's is 512; 1024 is sharper).
Enabled=1
Size=1024

[textures]
; Anisotropic filtering: the ground, roads and water stay sharp into the distance. 2 to 16 (capped by the card); 1 = off.
Anisotropy=8
ToggleKey=5
; Detail normals (with the lighting on): the ground's small bumps catch the sun. DetailBumpiness: how bumpy, from the
; detail textures' light and dark areas (0 = none). A detail texture's own normal map (its name with _normal, beside
; it) is used instead, at DetailNormalStrength.
DetailNormals=1
DetailNormalsToggleKey=6
DetailBumpiness=1.5
DetailNormalStrength=1
; Terrain blends (the edges where one terrain meets another): each square reads only its own tile of the blend texture,
; so no thin lines show along square edges where neighbouring tiles differ. 0 = as BtS.
BlendTileClamp=1
; Models drawn with these textures take the culture borders' tint, as the ground around them does, instead of standing
; over it (usually set by a mod: see "Models under the culture borders" in the README).
; ModelsUnderBorders=Art\Terrain\Features\Caves\cave.dds

[terrain tiles]
; Experimental, for modders. A plot stamp set with Flatten=1 levels the ground under a model rather than adding height:
; its pieces are weights, 0 to 1 over 0 to 65535, 0 by the edge of a square. See "Level ground under a model" in the README.
; PlotStamps1OnFeatures=FEATURE_CAVE
; PlotStamps1Folder=Art\Terrain\Stamps\CaveSeats
; PlotStamps1Flatten=1

[device]
; Games that ask for a "pure" device get an ordinary one, so GraphicsUpgrade can read the drawing state. Leave it on.
ClearPureDevice=1

[debug]
; Developer tools. With Traces=1, Ctrl+Shift+9 traces a frame.
Traces=0
