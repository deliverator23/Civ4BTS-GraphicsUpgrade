; GraphicsUpgrade settings. Keep this file next to GraphicsUpgrade's d3d9.dll in the Beyond the Sword folder. A mod can
; override any of them with its own Mods\<mod>\GraphicsUpgrade\GraphicsUpgrade.ini.

[general]
; Hotkeys are these modifiers plus the ToggleKey given in each section (ctrl, shift, alt joined with '+', or none).
; A ToggleKey is a letter or digit (W), a key name (F11, PrintScreen, Pause, Space, Insert, Home, PageUp,
; Numpad5...), or none for no hotkey.
Modifiers=ctrl+shift
; Where GraphicsUpgrade writes its small log (a "bts" subfolder is added). Empty = %LOCALAPPDATA%\GraphicsUpgrade.
; GraphicsUpgrade never writes into the game folders.
OutputDir=
; Games GraphicsUpgrade changes. bts = Civilization IV: Beyond the Sword (including its mods). In any other game the DLL
; just passes everything through.
Games=bts
; Optional: another d3d9.dll to pass calls on to, if you also use ReShade or DXVK (rename theirs and put the path
; here). Empty = Windows' own d3d9.dll.
ChainDll=

[water]
; Reflective, dynamic water: a shader reverse engineered from Civilization IV: Colonization's, with Colonization's
; water textures (Firaxis Games). The textures come in the GraphicsUpgrade folder next to this file; if that folder is
; missing, they're read from a Colonization install (below). If neither is found, BtS's water is left as it is.
Enabled=1
; Ctrl+Shift+W switches the reflective, dynamic water on and off in game.
ToggleKey=W
; Only used if the GraphicsUpgrade folder is missing: your Colonization folder (Steam default shown).
ColonizationDir=C:\Program Files (x86)\Steam\steamapps\common\Civilization IV Colonization
; Colonization's water settings: fresnel, reflection ripple, refraction ripple, alpha. The water's sun colour is in
; [lighting] (WaterSun).
WaterConstants=0.22995,0.238738,0.0954951,0.7
; Under the water: what ships and submarines have below the surface shows through it, clearest just under the
; surface (UnderwaterVisibility, 0 to 1) and fading out completely UnderwaterDepth world units down (0 = not shown).
; UnderwaterBands = steps in the fade (1 to 16).
UnderwaterDepth=25
UnderwaterVisibility=0.7
UnderwaterBands=8

[reflection]
; Ships reflected in the water, drawn the way Colonization draws them.
Enabled=1
; Reflection texture size in pixels (Colonization uses 512; 1024 is sharper and costs a little more).
Size=512
; Water height in world units (both games use 49.5; GraphicsUpgrade also reads it from the game each frame).
WaterHeight=49.5
; Developer view of the reflection texture: off.
Overlay=0
ToggleKey=none
OverlayToggleKey=none

[shadows]
; Sun shadows: units, ships and trees cast shadows onto the ground the way Colonization does it. BtS's round
; shadow blobs under units are hidden while it's on.
Enabled=1
; Ctrl+Shift+S switches the shadows on and off in game.
ToggleKey=S
; Shadow texture size in pixels. The shadowed area follows the ground in view, up to MaxRadius world units each way
; from the centre (one tile = 180); zoomed in, the same texture covers less ground, so shadows are sharper.
Size=2048
MaxRadius=2000
; Edge softness in shadow texels (0 = hard edges).
Softness=0.5
; How much light full shadow takes away (0 = none, 1 = black).
Darkness=0.45
; Direction the sunlight travels, x,y,z (Colonization's sun).
SunDirection=-0.567005,0.433955,-0.700134
HideBlobShadows=1
; Textures are named by path under Assets (the mod's, then the game's, loose or in its FPK archives) and recognised
; in game by their content. BlobShadowTexture: BtS's round shadow blob (it also marks where each unit stands).
; NoShadowTextures: models drawn with these cast no shadows; .dds files or folders of them, separated by ';'. The
; defaults are units' flags, which are markers rather than things in the world.
BlobShadowTexture=Art\Units\01_UnitShadows\unit_shadows.dds
NoShadowTextures=Art\Units\Flags; Art\Units\Flag\Medallions.dds
; Hills and peaks shade the terrain behind them (from the terrain's own heights). HillShadowSoftness: how many
; world units the ground must rise above a sunbeam for full shadow (bigger = softer edges).
HillShadows=1
HillShadowSoftness=8
; How much of a shadow the water's surface takes (0 = none, 1 = as dark as on land). Shadows also fall on the sea
; floor seen through the water.
WaterShadow=0.6
; Buildings, improvements and other solid models cast shadows too, and BtS's painted building shadows are hidden.
BuildingShadows=0
; How dark building shadows are (0 to 1; BtS's own painted building shadows are about 0.67).
BuildingDarkness=0.68
Overlay=0
OverlayToggleKey=none

[lighting]
; Light colours instead of BtS's light files, as Red,Green,Blue from 0 to 255.
; The defaults are Colonization's: a warm sun and a cool blue ambient (BtS: white sun, ambient 63,60,77).
Enabled=0
; Ctrl+Shift+L switches the lighting on and off in game.
ToggleKey=L
SunColour=255,235,188
AmbientColour=89,103,133
; Optional colours for one group only (empty = SunColour/AmbientColour; if those are empty too, the game's own):
; Unit = people and animals, Mech = ships, vehicles and machines, Terrain = the ground, River = rivers,
; Tree = trees (unlit in BtS), Building = buildings, improvements and other solid models, Water = the sun on the
; reflective, dynamic water (sun only; with the lighting off it's the water's default sun).
UnitSun=
UnitAmbient=
MechSun=
MechAmbient=
TerrainSun=
TerrainAmbient=
RiverSun=
RiverAmbient=
TreeSun=
TreeAmbient=
BuildingSun=
BuildingAmbient=
WaterSun=
; Light units and ships from the same direction as the sun shadows (1), or keep BtS's directions (0).
MatchShadowDirection=1
; Or light them from this direction instead (x,y,z, the way the light travels, like [shadows] SunDirection;
; BtS's own unit light: -0.378,0.882,-0.280). Empty = as MatchShadowDirection says.
LightDirection=
; Light cycle: the light changes over time, like a day. LightChangeCycleTime is the seconds (real time) for one full
; cycle, LightChangeStepCount the steps in a cycle (24 = hours of a day). At chosen steps, separated by ';':
;   LightCycleSteps          the sun's colour, step,R,G,B (at night: a silvery moon)
;   LightCycleAmbientSteps   the ambient (shade) colour, step,R,G,B; a dark ambient is what makes night dark
; The sun's path: once round the sky each cycle, clockwise like the real sun, never doubling back (sometimes lighting
; things from the front, sometimes from behind, as in Civilization VI). It moves the shadows, hill shadows and
; everything lit from the shadows' sun:
;   SunMiddayFrom            the compass direction the sun shines from at midday: N, NNE, NE ... NNW, or degrees
;                            (0 north, 90 east); with SSE it rises in the east-north-east and sets in the west-south-west
;   SunMiddayHeight          how high the sun is at midday, in degrees above the horizon (90 = overhead)
;   SunriseHeight            how high it is at sunrise and sunset, its lowest (lower = longer shadows)
;   MoonHeight               how high the moon is at midnight
; (For an exact path instead, LightCycleSunAngles = step,azimuth,elevation;...)
; Between the steps everything blends smoothly, from the last one round to the first. Groups with their own *Sun /
; *Ambient colour above keep it; leave a list empty to keep that part fixed. ShadowsFollowSun=1 fades the shadows as
; the sun dims (at night, the moon's faint shadows). LightCycleStartStep: where the cycle is when the game starts
; (12 = midday). The lists below are lined up by step; the order and the spaces don't matter.
LightCycleOn=0
; Ctrl+Shift+P pauses and resumes the light cycle.
LightCycleToggleKey=P
LightChangeCycleTime=1440
LightChangeStepCount=24
LightCycleStartStep=12
;                       midday (12)       afternoon (14)    afternoon (16)    golden hour (18)  sunset (20)       dusk (21)         night (22)        midnight (0)      night (2)         dawn (4)          dawn (5)          sunrise (6)       sunrise (7)       morning (8)       morning (10)
LightCycleSteps=        12,255,250,235;   14,255,238,203;   16,255,225,170;   18,255,220,32;    20,255,120,50;    21,210,70,55;     22,120,135,170;   0,120,135,170;    2,120,135,170;    4,150,90,180;     5,200,95,160;     6,235,105,110;    7,250,150,85;     8,255,225,170;    10,255,233,192
LightCycleAmbientSteps= 12,95,110,140;    14,92,107,137;    16,89,103,133;    18,96,90,114;     20,92,76,102;     21,72,62,90;      22,55,63,92;      0,55,63,92;       2,55,63,92;       4,55,63,92;       5,78,68,105;      6,104,88,116;     7,100,94,120;     8,89,103,133;     10,91,105,135
SunMiddayFrom=SSE
SunMiddayHeight=45
SunriseHeight=30
MoonHeight=50
ShadowsFollowSun=1
; The moon's glint on the water at night (20 to 4 h), R,G,B; empty = the cycle's moon colour.
MoonGlint=255,255,255
; The colours BtS's terrain lighting was made with (its SunLight.nif). Only change these if a mod replaces that file.
BakedTerrainSun=246,239,222
BakedTerrainAmbient=89,103,133
BakedTerrainDirection=-0.567005,0.433955,-0.700134

[device]
; GraphicsUpgrade reads the game's drawing state back from the graphics device. Games that ask for a "pure" device (which
; can't report its state) get an ordinary one instead. Leave this on.
ClearPureDevice=1

[debug]
; Developer tools (frame traces, shader dumps). Off in normal use.
Traces=0
DumpShaders=0
