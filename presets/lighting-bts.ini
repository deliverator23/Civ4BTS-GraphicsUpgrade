; Lighting preset: Beyond the Sword's own lighting, close to how the game looks without GraphicsUpgrade.
; A good starting point for your own colours. To use it, replace the [lighting] section of GraphicsUpgrade.ini
; with this file's [lighting] section.

[lighting]
Enabled=1
; Ctrl+Shift+3 switches GraphicsUpgrade's lighting on and off (none = no hotkey).
ToggleKey=3
; Colours are Red,Green,Blue from 0 to 255. Each group has its own here (or keeps BtS's own when empty).
SunColour=
AmbientColour=
; People and animals
UnitSun=204,204,176
UnitAmbient=88,88,72
; Ships and vehicles
MechSun=204,204,176
MechAmbient=88,88,72
; The ground. Empty: the light the game baked it with (Baked* below), so it's drawn exactly as baked.
TerrainSun=
TerrainAmbient=
; Rivers
RiverSun=246,239,222
RiverAmbient=89,103,133
; Trees: unlit in BtS. No sun and full ambient give exactly that.
TreeSun=0,0,0
TreeAmbient=255,255,255
; Buildings and improvements (BtS lights them with its SunLight too)
BuildingSun=246,239,222
BuildingAmbient=89,103,133
; The sun on the reflective, dynamic water: Colonization's sun, which its water was made for.
WaterSun=255,235,188
; Keep BtS's own light directions for units and ships.
MatchShadowDirection=0
LightDirection=
; The light stays fixed (no light cycle; GraphicsUpgrade.ini has one).
LightCycleOn=0
; The light the game baked the terrain with. Empty: read from the SunLight.nif the game uses (the running mod's, if it
; has its own); set them only to override that.
BakedTerrainSun=
BakedTerrainAmbient=
BakedTerrainDirection=
