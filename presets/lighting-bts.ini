; Lighting preset: Beyond the Sword's own lighting, close to how the game looks without GraphicsUpgrade, and a good
; starting point for your own colours. Replace the [lighting] and [lighting groups] sections of GraphicsUpgrade.ini
; with these two.

[lighting]
Enabled=1
ToggleKey=3
; Empty: each group below has its own colour, or keeps BtS's own.
SunColour=
AmbientColour=
; BtS's own light directions for units and ships.
MatchShadowDirection=0
LightDirection=
LitEffectTextures=
BakedTerrainSun=
BakedTerrainAmbient=
BakedTerrainDirection=
; The light stays fixed, and so does the sun: no SunMiddayFrom, so it's [shadows] SunDirection.
LightCycleOn=0
LightCycleToggleKey=4

[lighting groups]
UnitSun=204,204,176
UnitAmbient=88,88,72
MechSun=204,204,176
MechAmbient=88,88,72
; The ground: empty = the light the game baked it with, so it's drawn exactly as baked.
TerrainSun=
TerrainAmbient=
RiverSun=246,239,222
RiverAmbient=89,103,133
; Trees are unlit in BtS: no sun and full ambient give exactly that.
TreeSun=0,0,0
TreeAmbient=255,255,255
BuildingSun=246,239,222
BuildingAmbient=89,103,133
; The warm sun the water was made for.
WaterSun=255,235,188
