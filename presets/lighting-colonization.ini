; Lighting preset: Civilization IV: Colonization's lighting, one warm sun and a cool blue shade for everything.
; To use it, replace the [lighting] section of GraphicsUpgrade.ini with this file's [lighting] section.

[lighting]
Enabled=1
; Ctrl+Shift+3 switches GraphicsUpgrade's lighting on and off (none = no hotkey).
ToggleKey=3
; Colours are Red,Green,Blue from 0 to 255; these two apply to every group below that's left empty.
SunColour=255,235,188
AmbientColour=89,103,133
UnitSun=
UnitAmbient=
MechSun=
MechAmbient=
TerrainSun=
TerrainAmbient=
RiverSun=
RiverAmbient=
TreeSun=
TreeAmbient=
BuildingSun=
BuildingAmbient=
WaterSun=
; Light units and ships from the sun the shadows use ([shadows] SunDirection, Colonization's by default).
MatchShadowDirection=1
LightDirection=
; The light stays fixed (no light cycle; GraphicsUpgrade.ini has one).
LightCycleOn=0
; The light the game baked the terrain with. Empty: read from the SunLight.nif the game uses (the running mod's, if it
; has its own); set them only to override that.
BakedTerrainSun=
BakedTerrainAmbient=
BakedTerrainDirection=
