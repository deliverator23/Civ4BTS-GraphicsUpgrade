; Lighting preset: Civilization IV: Colonization's lighting, one warm sun and a cool blue shade for everything.
; Replace the [lighting] and [lighting groups] sections of GraphicsUpgrade.ini with these two.

[lighting]
Enabled=1
ToggleKey=3
SunColour=255,235,188
AmbientColour=89,103,133
; Units and ships lit from the shadows' sun.
MatchShadowDirection=1
LightDirection=
LitEffectTextures=
BakedTerrainSun=
BakedTerrainAmbient=
BakedTerrainDirection=
; The light stays fixed, and so does the sun: no SunMiddayFrom, so it's [shadows] SunDirection (Colonization's).
LightCycleOn=0
LightCycleToggleKey=4

[lighting groups]
UnitSun=
UnitAmbient=
MechSun=
MechAmbient=
TerrainSun=
TerrainAmbient=
RiverSun=
RiverAmbient=
TreeSun=
TreeAmbient=
BuildingSun=
BuildingAmbient=
WaterSun=
