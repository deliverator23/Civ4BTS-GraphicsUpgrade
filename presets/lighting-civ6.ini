; Lighting preset: a day and night cycle with Civilization VI's colours, the sun circling the sky once a "day" (every 24 minutes in lapsed time).
; To use it, replace the [lighting] section of GraphicsUpgrade.ini with this file's [lighting] section.

[lighting]
Enabled=1
; Ctrl+Alt+Shift+L switches GraphicsUpgrade's lighting on and off (none = no hotkey).
ToggleKey=L
; Colours are Red,Green,Blue from 0 to 255; these two apply to every group below that's left empty.
SunColour=142,119,83
AmbientColour=113,121,144
UnitSun=
UnitAmbient=
MechSun=
MechAmbient=
TerrainSun=
TerrainAmbient=
RiverSun=
RiverAmbient=
TreeSun=
TreeAmbient=
BuildingSun=
BuildingAmbient=
WaterSun=
; Light units and ships from the sun the shadows use (the light cycle's sun).
MatchShadowDirection=1
LightDirection=
; Light cycle: the light changes over time, like a day. LightChangeCycleTime is the seconds (real time) for one full
; cycle, LightChangeStepCount the steps in a cycle (24 = hours of a day). At chosen steps, separated by ';':
;   LightCycleSteps          the sun's colour, step,R,G,B (at night: a silvery moon)
;   LightCycleAmbientSteps   the ambient (shade) colour, step,R,G,B; a dark ambient is what makes night dark
;   LightCycleSunAngles      where the sun (or moon) is, step,azimuth,elevation in degrees: azimuth anticlockwise from
;                            east (0 east, 90 north, -90 south), elevation above the horizon; the shorter way round
;                            between steps. Civilization VI's own path (its sun doesn't move at a steady speed). For a
;                            simpler path, SunMiddayFrom, SunMiddayHeight, SunriseHeight and MoonHeight (see
;                            GraphicsUpgrade.ini) replace it.
; Between the steps everything blends smoothly, from the last one round to the first. Groups with their own *Sun /
; *Ambient colour above keep it; leave a list empty to keep that part fixed. ShadowsFollowSun=1 fades the shadows as
; the sun dims (at night, the moon's faint shadows). LightCycleStartStep: where the cycle is when the game starts
; (12 = midday). The lists below are lined up by step; the order and the spaces don't matter.
LightCycleOn=1
; Ctrl+Alt+Shift+P pauses and resumes the light cycle (none = no hotkey).
LightCycleToggleKey=P
LightChangeCycleTime=1440
LightChangeStepCount=24
LightCycleStartStep=12
;                       12:00             14:00             16:00             18:00             20:00             22:00             00:00             02:00             04:00             06:00             08:00             10:00
LightCycleSteps=        12,142,119,83;    14,135,113,68;    16,130,109,52;    18,139,124,42;    20,134,124,42;    22,90,86,48;      0,44,49,63;       2,44,49,63;       4,70,60,71;       6,82,57,60;       8,105,82,68;      10,123,102,75
LightCycleAmbientSteps= 12,113,121,144;   14,113,121,144;   16,111,116,139;   18,107,100,127;   20,107,95,127;    22,86,80,112;     0,37,53,88;       2,37,53,88;       4,36,53,88;       6,108,103,130;    8,109,109,134;    10,109,113,137
LightCycleSunAngles=    12,-60,45;        14,-86.7,43.7;    16,-113.3,40;     18,-140,35;       20,-166.4,30;     22,160.5,26.3;    0,120,25;         2,86.7,26.3;      4,53.3,30;        6,20,35;          8,-6.7,40;        10,-33.3,43.7
ShadowsFollowSun=1
; The moon's glint on the water at night (20 to 4 h), R,G,B; empty = the cycle's moon colour.
MoonGlint=
; What BtS baked the terrain lighting with (its SunLight.nif). Only change these if a mod replaces that file.
BakedTerrainSun=246,239,222
BakedTerrainAmbient=89,103,133
BakedTerrainDirection=-0.567005,0.433955,-0.700134
